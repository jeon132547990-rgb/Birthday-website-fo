name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Extract ZIP
        run: |
          mkdir site
          unzip -q "birthday website.zip" -d site
          INDEX=$(find site -type f -name "index.html" | head -n 1)
          if [ -z "$INDEX" ]; then
            echo "index.html not found"
            exit 1
          fi
      
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
